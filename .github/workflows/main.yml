name: Build APK from Single HTML

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare HTML and Extract Embedded Icon
        run: |
          mkdir -p www assets
          HTML_FILE=$(find . -maxdepth 2 -name "*.html" ! -path "./www/*" | head -n 1)
          if [ -z "$HTML_FILE" ]; then echo "Khong tim thay file .html nao trong kho!"; exit 1; fi
          cp "$HTML_FILE" www/index.html
          echo "Da nap file: $HTML_FILE"
          python3 -c 'import re,base64; h=open("www/index.html",encoding="utf-8").read(); m=re.search(r"app-icon-base64\"[^>]*content=\"([^\"]+)\"",h); open("assets/icon.png","wb").write(base64.b64decode(m.group(1))) if m else exit("Khong tim thay du lieu icon trong HTML")'

      - name: Initialize Capacitor and Embed Android Icon
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "So Can Mit Pro" "vn.io.linhkienpinthapmuoi.socanmit" --web-dir=www
          npx cap add android
          RES_DIR="android/app/src/main/res"
          rm -rf "$RES_DIR/mipmap-anydpi-v26"
          for PAIR in "48x48:mipmap-mdpi" "72x72:mipmap-hdpi" "96x96:mipmap-xhdpi" "144x144:mipmap-xxhdpi" "192x192:mipmap-xxxhdpi"; do
            SIZE="${PAIR%%:*}"
            DIR="${PAIR##*:}"
            mkdir -p "$RES_DIR/$DIR"
            convert assets/icon.png -resize "$SIZE" "$RES_DIR/$DIR/ic_launcher.png"
            convert assets/icon.png -resize "$SIZE" "$RES_DIR/$DIR/ic_launcher_round.png"
          done
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoCanMitPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
