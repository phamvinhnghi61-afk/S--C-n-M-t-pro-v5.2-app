name: Build APK from Single index.html

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Extract Embedded Logo & Prepare Web Assets
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          python3 -c '
          import re, base64
          html = open("index.html", encoding="utf-8").read()
          m = re.search(r"name=\"app-icon-base64\"\s+content=\"([^\"]+)\"", html)
          if not m:
              raise SystemExit("Khong tim thay du lieu icon trong index.html")
          open("assets/icon.png", "wb").write(base64.b64decode(m.group(1)))
          print("Da trich xuat thanh cong assets/icon.png")
          '

      - name: Initialize Capacitor & Embed Android Icon
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "So Can Mit Pro" "vn.io.linhkienpinthapmuoi.socanmit" --web-dir=www
          npx cap add android

          RES_DIR="android/app/src/main/res"
          rm -rf "$RES_DIR/mipmap-anydpi-v26"
          for SIZE_DIR in "48x48:mipmap-mdpi" "72x72:mipmap-hdpi" "96x96:mipmap-xhdpi" "144x144:mipmap-xxhdpi" "192x192:mipmap-xxxhdpi"; do
            SIZE="${SIZE_DIR%%:*}"
            DIR="${SIZE_DIR##*:}"
            mkdir -p "$RES_DIR/$DIR"
            convert assets/icon.png -resize "$SIZE" "$RES_DIR/$DIR/ic_launcher.png"
            convert assets/icon.png -resize "$SIZE" "$RES_DIR/$DIR/ic_launcher_round.png"
          done
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoCanMitPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
